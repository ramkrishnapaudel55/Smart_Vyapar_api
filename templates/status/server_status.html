<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Server Status</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #064e3b; /* dark green */
            color: #ecfdf5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background: #022c22;
            padding: 32px 44px;
            border-radius: 14px;
            text-align: center;
            box-shadow: 0 0 25px rgba(253, 224, 71, 0.25); /* yellow glow */
        }

        h1 {
            color: #fde047; /* yellow */
            margin-bottom: 12px;
            font-size: 28px;
        }

        p {
            font-size: 16px;
            opacity: 0.95;
            margin: 6px 0;
        }

        .status {
            margin-top: 14px;
            font-weight: bold;
            color: #22c55e; /* bright green */
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>🟢 SBA Server is Running</h1>
        <p>Django backend is live and responding.</p>
        <p class="status">Status: HEALTHY</p>
    </div>
</body>
</html>
